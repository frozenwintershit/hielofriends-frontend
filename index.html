<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hielofriends - Tienda de Pingüinos</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      input, select, button {
        padding: 10px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        background-color: #0070f3;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border: none;
      }
      button:hover {
        background-color: #0051b3;
      }
      #bloque-error {
        margin: 0;
        font-size: 0.9rem;
      }
      #contenedor-catalogo {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>🐧 Hielofriends - Gestión de Pedidos</h1>

    <!-- Formulario Pilar 2 -->
    <form id="form-reserva">
      <label for="txt-nombre">Nombre del cliente:</label>
      <input 
        type="text" 
        id="txt-nombre" 
        placeholder="Ej: Sebastián Vidal" 
        required 
      />

      <label for="slc-modelo">Modelo de peluche:</label>
      <select id="slc-modelo" required>
        <option value="Pingüino Emperador">🐧 Pingüino Emperador</option>
        <option value="Pingüino Adelia">❄️ Pingüino Adelia</option>
        <option value="Pingüino Papúa">🪨 Pingüino Papúa</option>
        <option value="Pingüino Penacho Amarillo">⚡ Pingüino Penacho Amarillo</option>
        <option value="Pingüino Azul">🌊 Pingüino Azul</option>
      </select>

      <label for="txt-cantidad">Cantidad:</label>
      <input 
        type="number" 
        id="txt-cantidad" 
        placeholder="Cantidad de peluches" 
        min="1" 
        value="1" 
        required 
      />

      <button type="submit">Crear Pedido</button>
      <p id="bloque-error" style="color: red;"></p>
    </form>

    <hr style="margin: 30px 0;" />

    <!-- Contenedor Pilar 3 -->
    <div id="contenedor-catalogo"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
