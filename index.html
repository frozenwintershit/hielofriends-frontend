<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hielofriends - Tienda de Pingüinos</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      input, select, button {
        padding: 10px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        background-color: #0070f3;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border: none;
      }
      button:hover {
        background-color: #0051b3;
      }
      #bloque-error {
        margin: 0;
        font-size: 0.9rem;
      }
      #contenedor-catalogo {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>🐧 Hielofriends - Gestión de Pedidos</h1>

    <!-- Formulario alineado con CreateOrderRequest de Spring Boot -->
    <form id="form-reserva" novalidate>
      <label for="slc-peluche">Seleccionar peluche del catálogo:</label>
      <select id="slc-peluche" required>
        <option value="" disabled selected>Cargando peluches disponibles...</option>
      </select>

      <label for="txt-email">Correo del cliente:</label>
      <input 
        type="email" 
        id="txt-email" 
        placeholder="cliente@ejemplo.com" 
        required 
      />

      <label for="txt-cantidad">Cantidad:</label>
      <input 
        type="number" 
        id="txt-cantidad" 
        placeholder="Cantidad de peluches" 
        min="1" 
        value="1" 
        required 
      />

      <button type="submit">Crear Pedido</button>
      <p id="bloque-error"></p>
    </form>

    <hr style="margin: 30px 0;" />

    <h3>Catálogo y Stock Disponible</h3>
    <div id="contenedor-catalogo"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
